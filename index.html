<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Govind | Python, वेबसाइट और ऑटोमेशन फ्रीलांसर</title>
<meta name="description" content="Govind - छोटे बिज़नेस और क्रिएटर्स के लिए वेबसाइट, Python स्क्रिप्ट और ऑटोमेशन। तेज़ डिलीवरी, सही दाम।">
<style>
:root{--accent:#0F6E56;--accent-d:#085041;--bg:#ffffff;--soft:#F3F8F6;--text:#1c2321;--muted:#5b6662;--line:#dfe8e4}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;color:var(--text);background:var(--bg);line-height:1.65;font-size:16px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:700;font-size:18px;color:var(--accent-d)}
nav a{margin-left:16px;color:var(--muted);text-decoration:none;font-size:14px}
nav a:hover{color:var(--accent)}
.hero{padding:56px 0 48px}
.tag{display:inline-block;background:var(--soft);color:var(--accent-d);padding:4px 12px;border-radius:99px;font-size:13px;margin-bottom:16px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.25;margin-bottom:14px}
.hero p{color:var(--muted);max-width:560px;margin-bottom:24px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:16px;font-family:inherit}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-left:8px}
.btn.ghost:hover{background:var(--soft)}
section{padding:48px 0}
section.alt{background:var(--soft)}
h2{font-size:26px;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.card h3{font-size:18px;margin-bottom:6px}
.card p{color:var(--muted);font-size:15px}
.price{margin-top:12px;font-weight:700;color:var(--accent-d)}
.steps{counter-reset:s;display:grid;gap:14px}
.step{display:flex;gap:14px;align-items:flex-start}
.step:before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.step b{display:block}
.step span{color:var(--muted);font-size:15px}
form{display:grid;gap:14px;max-width:520px}
label{font-size:14px;font-weight:600;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.err{color:#A32D2D;font-size:13px;margin-top:4px;display:none}
.note{font-size:13px;color:var(--muted)}
footer{padding:28px 0;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media(max-width:480px){.btn.ghost{margin-left:0;margin-top:10px}nav a{margin-left:10px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">Govind</div><nav><a href="#kaam">काम</a><a href="#process">प्रोसेस</a><a href="#book">बुक करें</a></nav></div></header>

<main>
<div class="wrap hero">
<span class="tag">Python · वेबसाइट · ऑटोमेशन</span>
<h1>आपका बिज़नेस ऑनलाइन, और रोज़ का काम अपने-आप</h1>
<p>मैं छोटे बिज़नेस, कोचिंग और क्रिएटर्स के लिए तेज़ वेबसाइट, Python स्क्रिप्ट और ऑटोमेशन बनाता हूँ। पहले बात, फिर काम, और दाम पहले ही तय।</p>
<a class="btn" href="#book">काम बुक करें</a><a class="btn ghost" href="#kaam">सर्विस देखें</a>
</div>
